<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 蓝色圆角背景 -->
  <rect x="20" y="20" width="360" height="360" rx="60" fill="#3483f3"/>
  <!-- 放大镜 -->
  <g transform="translate(110, 110)">
    <!-- 镜圈 -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#ffffff" stroke-width="24"/>
    <!-- 手柄 -->
    <line x1="150" y1="150" x2="220" y2="220" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>

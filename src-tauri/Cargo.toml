[package]
name = "opsnest"
version = "0.1.0-alpha.1"
description = "Local-first AI server manager"
authors = ["OpsNest contributors"]
edition = "2021"

[lib]
name = "opsnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
